name: build-korean-taxlaw-mcp

on:
  schedule:
    - cron: "0 18 * * *"        # 매일 03:00 KST (UTC 18:00)
  workflow_dispatch:
    inputs:
      ref:
        description: "zisu17/korean-taxlaw-mcp 브랜치/태그/커밋 (비우면 기본 브랜치)"
        default: ""
        required: false
      platforms:
        description: "linux/amd64, linux/arm64"
        default: "linux/amd64"
        required: true

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: zisu17/korean-taxlaw-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # 업스트림은 GitHub 릴리스가 없고 태그도 pyproject 버전보다 늦으므로
      # ref 입력이 비어 있으면(스케줄 실행 포함) 기본 브랜치 HEAD 커밋을 빌드한다.
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          default_branch="$(gh api "repos/$UPSTREAM" --jq .default_branch)"
          ref="${INPUT_REF:-$default_branch}"
          sha="$(gh api "repos/$UPSTREAM/commits/$ref" --jq .sha)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha::7}" >> "$GITHUB_OUTPUT"
          # 기본 브랜치를 빌드할 때만 latest 를 갱신 (옛 태그 수동 빌드로 latest 가 되돌아가지 않게)
          [ "$ref" = "$default_branch" ] && echo "latest=true" >> "$GITHUB_OUTPUT" || true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 스케줄 실행에서는 이미 빌드한 커밋이면 건너뜀 (수동 실행은 항상 빌드)
      - id: check
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/korean-taxlaw-mcp:sha-${{ steps.ref.outputs.short }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already exists; skipping build"
          fi

      # 업스트림 저장소의 Dockerfile 을 그대로 사용한다.
      - uses: actions/checkout@v6
        if: steps.check.outputs.skip != 'true'
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.ref.outputs.sha }}
          persist-credentials: false

      - id: version
        if: steps.check.outputs.skip != 'true'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        if: steps.check.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.skip != 'true'

      - uses: docker/build-push-action@v7
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          tags: |
            ${{ steps.ref.outputs.latest == 'true' && format('ghcr.io/{0}/korean-taxlaw-mcp:latest', steps.owner.outputs.name) || '' }}
            ghcr.io/${{ steps.owner.outputs.name }}/korean-taxlaw-mcp:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.name }}/korean-taxlaw-mcp:sha-${{ steps.ref.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
